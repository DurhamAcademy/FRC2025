plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2025.3.1"
    id "com.peterabeles.gversion" version "1.10" // Ensure this is the latest stable version you intend to use
    id "com.diffplug.spotless" version "6.23.3"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

deploy {
    /* ... existing full definition ... */
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            team = project.frc.getTeamNumber(); debug = project.frc.getDebugOrDefault(false);
            artifacts {
                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                    jvmArgs.add("-XX:+UnlockExperimentalVMOptions"); jvmArgs.add("-XX:GCTimeRatio=5"); jvmArgs.add("-XX:+UseSerialGC"); jvmArgs.add("-XX:MaxGCPauseMillis=50");
                    final MAX_JAVA_HEAP_SIZE_MB = 100; jvmArgs.add("-Xmx" + MAX_JAVA_HEAP_SIZE_MB + "M"); jvmArgs.add("-Xms" + MAX_JAVA_HEAP_SIZE_MB + "M"); jvmArgs.add("-XX:+AlwaysPreTouch");
                }
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) { files = project.fileTree('src/main/deploy'); directory = '/home/lvuser/deploy'; deleteOldFiles = false; }
            }
        }
    }
}
def deployArtifact = deploy.targets.roborio.artifacts.frcJava

wpi.java.debugJni = false
def includeDesktopSupport = true

// --- PHASE 1: Code Generation & Injection Tasks ---
task runLanguageInterpreter(type: JavaExec) {
    group = "FRC Backend"
    description = "Runs the Language Interpreter GUI, which generates JavaOutput.txt"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'frc.robot.LanguageInterpreter'
    outputs.file("JavaOutput.txt").withPropertyName("outputMappingFile")
    inputs.file("ConfigFile.txt").withPathSensitivity(PathSensitivity.RELATIVE).optional(false)
    doFirst {
        //println "PHASE 1: Running Language Interpreter GUI..."
        //println "DEBUG: Effective classpath for runLanguageInterpreter: ${classpath.files.collect { it.absolutePath }.join(File.pathSeparator)}"
        if (!file("ConfigFile.txt").exists()) {
            throw new InvalidUserDataException("ERROR: ConfigFile.txt not found at project root.")
        }
    }
    doLast {
        if (file("JavaOutput.txt").exists()) {
            //println "PHASE 1: Language Interpreter finished."
        } else {
            logger.warn("PHASE 1 WARN: JavaOutput.txt not found.")
        }
    }
}

task injectFileContent {
    group = "FRC Backend"
    description = "Replaces a placeholder in RobotContainer.java with content from JavaOutput.txt"
    dependsOn runLanguageInterpreter
    def sourceContentFile = project.file("JavaOutput.txt")
    def targetFileToModify = project.file("src/main/java/frc/robot/RobotContainer.java") // *** YOUR TARGET FILE ***
    def placeholderToReplace = "/*REPLACE THIS*/" // *** YOUR PLACEHOLDER ***
    inputs.file(sourceContentFile).optional(true)
    inputs.file(targetFileToModify); outputs.file(targetFileToModify)
    doLast {
        //logger.lifecycle("PHASE 1: Attempting to inject content into ${targetFileToModify.name}")
        if (!sourceContentFile.exists() && !inputs.files.getProperty("sourceContentFile").optional) {
            throw new GradleException("ERROR: Source content file (${sourceContentFile.name}) not found.")
        }
        if (!sourceContentFile.exists() && inputs.files.getProperty("sourceContentFile").optional) {
            logger.warn("PHASE 1 WARN: Source file not found, skipping injection."); return
        }
        if (!targetFileToModify.exists()) {
            throw new GradleException("PHASE 1 ERROR: Target file (${targetFileToModify.name}) not found.")
        }
        String contentToInject = sourceContentFile.text.trim(); String targetOriginalContent = targetFileToModify.text
        if (contentToInject.isEmpty() && inputs.files.getProperty("sourceContentFile").optional) {
            logger.info("PHASE 1: Source is empty and optional. Replacing placeholder with empty string.")
        }
        else if (contentToInject.isEmpty()){
            logger.warn("PHASE 1 WARN: Source is empty. Replacing placeholder with empty string.")
        }
        if (targetOriginalContent.contains(placeholderToReplace)) {
            String modifiedContent = targetOriginalContent.replace(placeholderToReplace, contentToInject); targetFileToModify.text = modifiedContent; //logger.lifecycle("PHASE 1: Successfully injected content into ${targetFileToModify.name}")
        } else {
            logger.warn("PHASE 1 WARN: Placeholder '${placeholderToReplace}' not found in ${targetFileToModify.name}. Try running the reset command in the meno on your right.")
        }
    }
}

task reset {
    group = "Pseudo Code Commands"
    description = "Resets the injected code in RobotContainer.java back to its placeholder."

    def targetFileToModify = project.file("src/main/java/frc/robot/RobotContainer.java") // *** YOUR TARGET FILE ***
    def originalPlaceholder = "/*REPLACE THIS*/" // *** YOUR ORIGINAL PLACEHOLDER ***
    def beginMarker = "// BEGIN GENERATED PSEUDO CODE"
    def endMarker = "// END GENERATED PSEUDO CODE"

    inputs.file(targetFileToModify)
    outputs.file(targetFileToModify)

    doLast {
        //logger.lifecycle("Attempting to reset injected code in ${targetFileToModify.name}")
        logger.lifecycle('Code is being reset')
        if (!targetFileToModify.exists()) {
            throw new GradleException("ERROR: Target file (${targetFileToModify.name}) not found.")
        }
        String currentContent = targetFileToModify.text
        int startIndex = currentContent.indexOf(beginMarker)
        int endIndex = currentContent.indexOf(endMarker)

        if (startIndex != -1 && endIndex != -1 && startIndex < endIndex) {
            String prefix = currentContent.substring(0, startIndex + beginMarker.length())
            String suffix = currentContent.substring(endIndex)
            // Add a newline after the beginMarker, then indent the placeholder
            String newContent = prefix + "\n" +
                    "        " + originalPlaceholder + "\n" + // Adjust indentation as needed
                    "        " + suffix // This assumes endMarker was also indented similarly
            targetFileToModify.text = newContent
            //logger.lifecycle("Successfully reset content between markers in ${targetFileToModify.name} to placeholder.")
            logger.lifecycle("Successfully reset code")
        } else if (currentContent.contains(originalPlaceholder)) {
            logger.lifecycle("Placeholder '${originalPlaceholder}' already present, or markers not found. No reset action taken based on markers.")
        } else {
            logger.warn("WARN: Markers ('${beginMarker}', '${endMarker}') not found for reset in ${targetFileToModify.name}. Placeholder also not found. Manual check may be needed.")
        }
    }
}


task writeCode {
    group = "Pseudo Code Commands"
    description = "Runs GUI and injects code into RobotContainer.java."
    dependsOn injectFileContent
    doLast {
        logger.lifecycle("PHASE 1: writeCode finished. RobotContainer.java should be updated.")
        logger.lifecycle("Run one of the options in the API if you would like to use your code")
        logger.lifecycle("Or click reset in the menu to write another one") // Added info
    }
}

// --- END PHASE 1 ---

// --- PHASE 2: Standard Build/Deploy Tasks ---
task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations(); implementation wpi.java.deps.wpilib(); implementation wpi.java.vendor.java()
    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio); roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio); roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio); roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)
    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop); nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop); simulationDebug wpi.sim.enableDebug()
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop); nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop); simulationRelease wpi.sim.enableRelease()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}
test { useJUnitPlatform(); systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true' }
wpi.sim.addGui().defaultEnabled = true; wpi.sim.addDriverstation()
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }; from sourceSets.main.allSource
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS); duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
deployArtifact.jarTask = jar; wpi.java.configureExecutableTasks(jar); wpi.java.configureTestTasks(test)
tasks.withType(JavaCompile) { options.compilerArgs.add '-XDstringConcat=inline' }

// Create version file - Standard hook for gversion
// This means `compileJava` (for main sources) will depend on `createVersionFile`.
// This task will run during Phase 2 (e.g., when `build` is called).
project.compileJava.dependsOn(createVersionFile)

gversion {
    srcDir = "src/main/java/"
    classPackage = "frc.robot"
    className = "BuildConstants"
    // REMOVED the incorrect 'filePath' setting
    dateFormat = "yyyy-MM-dd HH:mm:ss z"
    timeZone = "America/New_York"
    indent = "  "
}

task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"; def branch = 'git branch --show-current'.execute().text.trim(); def commitMessage = "Update at '${new Date().toString()}'"
            if (branch.startsWith(branchPrefix)) {
                exec { workingDir(projectDir); executable 'git'; args 'add', '-A' }
                exec { workingDir(projectDir); executable 'git'; args 'commit', '-m', commitMessage; ignoreExitValue = true }
                println "Committed to branch: '$branch'\nCommit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy) // This ordering is fine

// Spotless - Standard hook for compileJava
// This means `compileJava` (for main sources) will depend on `spotlessApply`.
// This formatting will occur during Phase 2.
project.compileJava.dependsOn(spotlessApply)

spotless {
    java { target fileTree(project.projectDir) { include "**/*.java"; exclude "**/build/**", "**/build-*/**" }; toggleOffOn(); googleJavaFormat('1.17.0').aosp().reflowLongStrings(); removeUnusedImports(); trimTrailingWhitespace(); endWithNewline(); }
    groovyGradle { target fileTree(project.projectDir) { include "**/*.gradle"; exclude "**/build/**", "**/build-*/**" }; greclipse(); indentWithSpaces(4); trimTrailingWhitespace(); endWithNewline(); }
    json {
        target fileTree(project.projectDir) {
            include '**/*.json'
            exclude '**/build/**', '**/build-*/**', '**/node_modules/**', '.gradle/**', '**/vendordeps/**', '**/wpilib_preferences.json'
        }
        gson().indentWithSpaces(2)
    }
    format "misc", { target fileTree(project.projectDir) { include "**/*.md", "**/.gitignore"; exclude "**/build/**", "**/build-*/**" }; trimTrailingWhitespace(); indentWithSpaces(2); endWithNewline(); }
}

// Check jar task for completeness:
jar {
    group = BasePlugin.BUILD_GROUP // Standard group
    description = "Assembles a jar archive containing the main classes." // Standard description
    // from blocks and manifest are already there
}

// Check test task for completeness:
test {
    group = JavaBasePlugin.VERIFICATION_GROUP // Standard group
    description = "Runs the unit tests." // Standard description
    // useJUnitPlatform and systemProperty are already there
}
